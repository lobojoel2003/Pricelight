[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "pricelight"
dynamic = ["version"]
description = "Pricelight data pipeline: discover, download and parse hospital price files into a searchable Parquet + DuckDB dataset."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pricelight contributors" }]
keywords = ["hospital", "price transparency", "duckdb", "polars", "parquet", "healthcare"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pricelight-parser==0.1.0",
  "duckdb>=1.1",
  "polars>=1.0",
  "pyarrow>=15",
  "httpx>=0.27",
]

[project.scripts]
pricelight = "pricelight.cli:main"

[project.urls]
Homepage = "https://github.com/lobojoel2003/Pricelight"
Issues = "https://github.com/lobojoel2003/Pricelight/issues"
Changelog = "https://github.com/lobojoel2003/Pricelight/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/pricelight/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pricelight"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
