version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    ignore:
      # svelte-check supports TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Must match the apache-arrow major that @duckdb/duckdb-wasm depends on.
      - dependency-name: apache-arrow
        update-types: ["version-update:semver-major"]
    groups:
      site-dev:
        dependency-type: development
      site-runtime:
        dependency-type: production
