name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRICELIGHT_BUILD_NUMBER: ${{ github.run_number }}
  PRICELIGHT_COMMIT: ${{ github.sha }}
  FORCE_COLOR: "1"

jobs:
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/version.py check

  lint:
    name: Lint & type-check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  python:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: Build Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build --package pricelight-parser --out-dir dist
      - run: uv build --package pricelight --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Install the wheels in a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/pricelight-parse --version
          /tmp/wheel-env/bin/pricelight --version
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          retention-days: 14

  site:
    name: Site (check, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the demo dataset with the pipeline
        working-directory: .
        run: |
          uv sync --locked
          uv run pricelight --data data run --demo --publish site/public/data
          uv run pricelight --data data report
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist/
          retention-days: 7
